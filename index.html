.bk.F{background:var(--acc)}.bk.D{background:var(--amb)}.bk.U{background:var(--hit)}
#sheet .idx{position:relative;z-index:1}
#sheet .idx::after{content:"";position:absolute;inset:-8px -14px -8px -8px}
.sheetbar{display:flex;justify-content:flex-end;margin:0 0 6px;font-size:.88rem}
#sheet.hideidx .idx{visibility:hidden;pointer-events:none}
#sheet .card.cur{background:color-mix(in srgb,var(--hit) 14%,transparent)}
details{margin-top:28px}
summary{cursor:pointer;font-weight:600;margin-bottom:12px}
#all16{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border:1px solid var(--bd);border-radius:8px;padding:8px 6px;column-gap:0;row-gap:4px}
#all16 .card{cursor:default}
#all16 .hint{visibility:visible}
#all16 .cb{display:inline-block;margin:0 0 0 2px;padding:0 5px;font-size:.66rem;line-height:1.3;font-weight:700;color:var(--ink)}
</script>
<script>
window.PAGES={cards:function(){const __off=[];const __on=(e,f)=>{document.addEventListener(e,f);__off.push([e,f])};

const INK="var(--ink)",N=(d)=>["n",d],R=(d)=>["r",d];
// 15 張卡片：每張 = 一拍，總長 4 個十六分音符
const CARDS=[
 {id:"4不打",e:[N(1),N(1),N(2)]},
 {id:"3不打",e:[N(1),N(2),N(1)]},
 {id:"2不打",e:[N(2),N(1),N(1)]},
 {id:"1不打",e:[R(1),N(1),N(1),N(1)]},
 {id:"12",e:[N(1),N(3)]},
 {id:"23",e:[R(1),N(1),N(2)]},
 {id:"34",e:[R(2),N(1),N(1)]},
 {id:"14",e:[N(3),N(1)]},
 {id:"24",e:[R(1),N(2),N(1)]},
 {id:"13",e:[N(2),N(2)]},
 {id:"1",e:[N(4)]},
 {id:"2",e:[R(1),N(3)]},
 {id:"3",e:[R(2),N(2)]},
 {id:"4",e:[R(3),N(1)]},
 {id:"全打",e:[N(1),N(1),N(1),N(1)],isNew:true}
];
const YC=78,X=s=>12.5+s*25;
function eighthRest(cx){return `<circle cx="${cx-3.5}" cy="${YC-5}" r="2.6"/><path d="M${cx-3.5} ${YC-4}Q${cx+1} ${YC-4} ${cx+3} ${YC-8.5}" fill="none" stroke-width="1.5"/><path d="M${cx+3} ${YC-8.5}L${cx-2.5} ${YC+9}" stroke-width="1.8"/>`}
function sixteenthRest(cx){let s=`<path d="M${cx+4} ${YC-9}L${cx-4} ${YC+13}" stroke-width="1.8"/>`;
 for(let k=0;k<2;k++){const t=.05+.32*k,px=cx+4-8*t,py=YC-9+22*t;
  s+=`<circle cx="${px-4.5}" cy="${py+3.5}" r="2.4"/><path d="M${px-4.5} ${py+3.5}Q${px} ${py+3.5} ${px} ${py-.5}" fill="none" stroke-width="1.4"/>`}
 return s}
// 緊湊排版：卡片寬度依內容決定，音符彼此緊貼（練習頁使用）
const LW=o=>o.k=="r"?(o.d==1?13:o.d==2?15:20):(o.d==3?19:16);
function layoutFit(c,last,slot){let t=0;const ev=c.e.map(([k,d])=>{const o={k,d,s:t,tag:0};t+=d;o.w=LW(o);return o});
 if(slot){ev.forEach((o,k)=>{o.x=(k+.5)*slot});return {ev,W:ev.length*slot}}
 const pl=1.5,pr=last?7:1.5,sum=ev.reduce((a,o)=>a+o.w,0),W=Math.max(46,sum+pl+pr);
 let x=pl+(W-pl-pr-sum)/2;ev.forEach(o=>{o.x=x+o.w/2;x+=o.w});return {ev,W}}
function cardSVG(c,first,last,num,soft,nb,fit){
 const L=fit?layoutFit(c,last,fit):null,Wd=fit?L.W:100;
 let t=0;const ev=c.e.map(([k,d])=>{const o={k,d,s:t};t+=d;return o});
 const hit=[0,0,0,0];ev.forEach(o=>{if(o.k=="n")hit[o.s]=1});
 let g=`<g stroke="var(--line)" stroke-width="1">`;
 if(!fit)for(let i=0;i<5;i++)g+=`<line x1="0" x2="${Wd}" y1="${62+i*8}" y2="${62+i*8}"/>`;
 g+=`</g><g stroke="${INK}" stroke-width="1.6">`;
 if(first)g+=`<line x1=".8" x2=".8" y1="62" y2="94"/>`;
 if(last&&!fit)g+=soft?`<line x1="${Wd-.6}" x2="${Wd-.6}" y1="62" y2="94" stroke="var(--line)" stroke-width="1"/>`:`<line x1="${Wd-1.2}" x2="${Wd-1.2}" y1="62" y2="94" stroke-width="3"/>`;
 g+=`</g>`;
 for(let i=0;i<4;i++)g+=`<text class="num" x="${fit?Wd/2+(i-1.5)*Math.min(11.5,Wd/4.2):X(i)}" y="22" text-anchor="middle" font-size="${fit?(Wd/4.2<10?8:10):12}" font-weight="${hit[i]?700:400}" fill="${hit[i]?"var(--hit)":"var(--miss)"}">${i+1}</text>`;
 // 位置依時值等比例排列（1 個十六分音符 = 25 單位）；連桿可跨相鄰卡片（同一小節內）相連
 const mk=(card,off,tag)=>{let t=0;return card.e.map(([k,d])=>{const o={k,d,s:t,tag,x:off+X(t+(k=="r"?(d-1)/2:0))};t+=d;return o})};
 const ev0=fit?L.ev:mk(c,0,0);
 const chain=[...(nb&&nb.prev?mk(nb.prev,-100,-1):[]),...ev0,...(nb&&nb.next?mk(nb.next,100,1):[])];
 const top=YC-32;let body=`<g fill="${INK}" stroke="${INK}">`;
 // 分組連桿：連續且短於四分音符的音符（休止符會斷開）
 const groups=[];let cur=[];
 chain.forEach(o=>{if(o.k=="n"&&o.d<4)cur.push(o);else{if(cur.length)groups.push(cur);cur=[]}});
 if(cur.length)groups.push(cur);
 const grouped=new Set();groups.forEach(gr=>{if(gr.length>=2)gr.forEach(o=>grouped.add(o))});
 ev0.forEach(o=>{const x=o.x;
  if(o.k=="r"){const cx=x;body+=o.d==1?sixteenthRest(cx):eighthRest(cx)+(o.d==3?`<circle cx="${cx+7}" cy="${YC-3}" r="1.8" stroke="none"/>`:"");return}
  body+=`<g class="nt" data-s="${o.s}"><ellipse cx="${x}" cy="${YC}" rx="5.3" ry="3.8" transform="rotate(-20 ${x} ${YC})" stroke="none"/><line x1="${x+4.9}" x2="${x+4.9}" y1="${YC-1}" y2="${top}" stroke-width="1.5"/>`;
  if(o.d==3)body+=`<circle cx="${x+11}" cy="${YC-4}" r="1.8" stroke="none"/>`;
  if(!grouped.has(o)&&o.d<4){const f=o.d==1?2:1;for(let k=0;k<f;k++){const y=top+k*6;body+=`<path d="M${x+4.9} ${y}C${x+6} ${y+6} ${x+15} ${y+8} ${x+11} ${y+17}" fill="none" stroke-width="2.2"/>`}}
 body+="</g>";
 });
 // 連桿：每一段由左邊那個音符所屬的卡片負責繪製（可延伸到相鄰卡片）
 groups.forEach(gr=>{if(gr.length<2)return;
  gr.forEach((o,i)=>{
   if(o.tag!==0)return;
   const nx=gr[i+1],pv=gr[i-1],x=o.x+4.9;
   if(nx){const x2=nx.x+4.9;
    body+=`<polygon stroke="none" points="${x-.7},${top} ${x2+.7},${top} ${x2+.7},${top+4.2} ${x-.7},${top+4.2}"/>`;
    if(o.d==1&&nx.d==1&&nx.tag===o.tag)body+=`<polygon stroke="none" points="${x},${top+7} ${x2},${top+7} ${x2},${top+11} ${x},${top+11}"/>`;
   }
   if(o.d==1){
    const conn=(pv&&pv.d==1&&pv.tag===o.tag)||(nx&&nx.d==1&&nx.tag===o.tag);
    if(!conn){const dir=(pv&&pv.tag===o.tag)?-1:(nx&&nx.tag===o.tag)?1:(o.s>=2?-1:1);
     body+=`<polygon stroke="none" points="${x},${top+7} ${x+dir*9},${top+7} ${x+dir*9},${top+11} ${x},${top+11}"/>`}
   }
  })});
 body+=`</g>`;
 return `<svg viewBox="0 0 ${Wd} 100" role="img" aria-label="${c.id}">${g}${body}</svg>`;
}
function render(list,el,num){
 el.innerHTML="";
 if(!num){
  const slotOf=r0=>{const n=Math.min(8,list.length-r0);let N=0;for(let k=r0;k<r0+n;k++)N+=list[k].e.length;return 800/(N+N/n*(8-n))};
  let col=1,cum=0;
  list.forEach((c,i)=>{
   if(i%8==0){col=1;cum=0}
   const r0=i-i%8,slot=slotOf(r0),Wc=c.e.length*slot;
   cum+=Wc;const end=Math.round(cum*2)+1,span=end-col;
   const d=document.createElement("div");d.className="card"+(i%4==3?" mend":"");d.style.gridRow=Math.floor(i/8)+1;d.style.gridColumn=col+" / span "+span;col=end;d.style.setProperty("--W",Wc);
   const b=document.createElement("span");b.className="idx";b.textContent=i+1;b.title="從這一拍開始";
   b.onclick=e=>{e.stopPropagation();setStart(i+1)};
   d.appendChild(b);
   d.insertAdjacentHTML("beforeend",cardSVG(c,false,i%4==3,false,true,null,slot));
   d.style.cursor="pointer";d.onclick=()=>d.classList.toggle("on");
   el.appendChild(d);
  });
  return;
 }
 for(let i=0;i<list.length;i+=4){
  const m=document.createElement("div");m.className="measure";
  const part=list.slice(i,i+4);
  part.forEach((c,j)=>{const d=document.createElement("div");d.className="card";
   d.innerHTML=cardSVG(c,j==0,j==part.length-1,num);m.appendChild(d)});
  el.appendChild(m);
 }
}
const $=id=>document.getElementById(id),inp=$("n"),rng=$("r");
function clamp(v){v=parseInt(v,10);return isNaN(v)?16:Math.max(1,Math.min(32,v))}
function setN(v){v=clamp(v);inp.value=v;rng.value=v;draw()}
function draw(){stop();const n=clamp(inp.value);
 const list=Array.from({length:n},()=>CARDS[Math.floor(Math.random()*CARDS.length)]);
 curList=list;render(list,$("sheet"));si.max=Math.max(n,1);si.disabled=!n;setStart(1);
}
inp.oninput=()=>{if(inp.value!==""){const v=clamp(inp.value);rng.value=v;draw()}};
inp.onchange=()=>{inp.value=rng.value=clamp(inp.value)};
rng.oninput=()=>{inp.value=rng.value;draw()};
$("minus").onclick=()=>setN(clamp(inp.value)-1);
$("plus").onclick=()=>setN(clamp(inp.value)+1);
$("go").onclick=draw;
$("shownum").onchange=e=>$("sheet").classList.toggle("shownum",e.target.checked);
$("hideidx").onchange=e=>$("sheet").classList.toggle("hideidx",e.target.checked);
let ac=null,timer=0,raf=0,nextT=0,step=0,q=[],curList=[],playing=false,cts=[];
function tone(t,f0,f1,v,len,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!=f0)o.frequency.exponentialRampToValueAtTime(f1,t+len*.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.02)}
function sched(){const sd=60/Math.max(30,Math.min(180,+$("bpm").value||45))/4,total=curList.length*4;
 while(nextT<ac.currentTime+.12){const ci=step>>2,s=step&3;
  if($("met").checked){const a=s==0,f=a?1000:700;tone(nextT,f,f,a?.35:.2,.04,"sine")}
  if($("drm").checked&&hitsOf(curList[ci]).includes(s))tone(nextT,260,110,.7,.14,"triangle");
  q.push([nextT,step]);nextT+=sd;step=(step+1)%total}}
function mark(st){document.querySelectorAll("#sheet .cur,#sheet .nt.on").forEach(e=>e.classList.remove("cur","on"));
 const ci=st>>2,s=st&3,c=$("sheet").querySelectorAll(".card")[ci];if(!c)return;c.classList.add("cur");
 const n=c.querySelector(`.nt[data-s="${s}"]`);if(n)n.classList.add("on");
 if(s==0)c.scrollIntoView({block:"nearest",behavior:"smooth"})}
function loop(){const t=ac.currentTime;while(q.length&&q[0][0]<=t){const e=q.shift();if($("dyn").checked)mark(e[1])}raf=requestAnimationFrame(loop)}
function start(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();step=curList.length?(sc(si.value)-1)*4:0;q=[];nextT=ac.currentTime+.1;if(!curList.length){playing=true;$("play").textContent="■ 停止";return}{const c=$("sheet").querySelectorAll(".card")[step>>2];if(c)c.scrollIntoView({block:"nearest",behavior:"smooth"})}if($("dyn").checked)countIn();
 timer=setInterval(sched,25);raf=requestAnimationFrame(loop);playing=true;$("play").textContent="■ 停止"}
function countIn(){const sd=60/Math.max(30,Math.min(180,+$("bpm").value||45))/4;const t0=nextT;nextT+=sd*4;
 for(let i=0;i<4;i++){const a=i==0,f=a?1000:700;tone(t0+i*sd,f,f,a?.35:.2,.04,"sine")}}
function stop(){cts.forEach(clearTimeout);cts=[];if(window.speechSynthesis)speechSynthesis.cancel();clearInterval(timer);cancelAnimationFrame(raf);q=[];playing=false;$("play").textContent="▶ 播放";
 document.querySelectorAll("#sheet .cur,#sheet .nt.on").forEach(e=>e.classList.remove("cur","on"))}
$("play").onclick=()=>playing?stop():start();
const bi=$("bpm"),br=$("brng"),bc=v=>{v=parseInt(v,10);return isNaN(v)?45:Math.max(30,Math.min(180,v))};
bi.oninput=()=>{if(bi.value!=="")br.value=bc(bi.value)};
bi.onchange=()=>{bi.value=br.value=bc(bi.value)};
br.oninput=()=>{bi.value=br.value};
$("bminus").onclick=()=>{bi.value=br.value=bc(bc(bi.value)-1)};
$("bplus").onclick=()=>{bi.value=br.value=bc(bc(bi.value)+1)};
$("dyn").onchange=e=>{if(!e.target.checked)document.querySelectorAll("#sheet .cur,#sheet .nt.on").forEach(x=>x.classList.remove("cur","on"))};
const si=$("st");
function sc(v){v=parseInt(v,10);return isNaN(v)?1:Math.max(1,Math.min(Math.max(curList.length,1),v))}
function markStart(){document.querySelectorAll("#sheet .card.startc").forEach(e=>e.classList.remove("startc"));const c=$("sheet").querySelectorAll(".card")[sc(si.value)-1];if(c&&curList.length)c.classList.add("startc")}
function setStart(v){si.value=sc(v);markStart()}
let wl=null,wlBusy=false;
async function keepAwake(){if(wl||wlBusy||!("wakeLock" in navigator)||document.visibilityState!=="visible")return;wlBusy=true;try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}catch(e){wl=null}wlBusy=false}
__on("visibilitychange",keepAwake);
["pointerdown","keydown"].forEach(ev=>__on(ev,keepAwake));
keepAwake();
render(CARDS,$("all"),true);
function hitsOf(c){let t=0;const h=[];c.e.forEach(([k,d])=>{if(k=="n")h.push(t);t+=d});return h}
function derive(c){const h=hitsOf(c);
 const A=[0,1,2,3].map(i=>h.includes(i)?N(1):R(1));
 const B=[];A.forEach(([k,d])=>{const l=B[B.length-1];if(k=="r"&&l&&l[0]=="r")l[1]+=d;else B.push([k,d])});
 const C=[];B.forEach(([k,d])=>{const l=C[C.length-1];if(k=="r"&&l&&l[0]=="n")l[1]+=d;else C.push([k,d])});
 const st=[[A,"原始：不打的寫休止符"]];
 if(JSON.stringify(B)!=JSON.stringify(A))st.push([B,"相連的休止符合併"]);
 if(JSON.stringify(C)!=JSON.stringify(B))st.push([C,"休止符併入前一個音符"]);
 return st}
CARDS.forEach(c=>{const st=derive(c),h=hitsOf(c).map(i=>i+1);
 const it=document.createElement("div");it.className="ditem";
 it.innerHTML=`<h3>${h.length==4?"1、2、3、4 全打":"打 "+h.join("、")}</h3><div class="drow">`+st.map(([e,l],i)=>`<figure><div class="card${i?"":" first"}">${i?`<span class="ar">→</span>`:""}${cardSVG({id:l,e},false,false)}</div><figcaption>${l}${i==st.length-1?"（最簡）":""}</figcaption></figure>`).join("")+`</div>`;
 $("derive").appendChild(it)});
draw();

return ()=>{try{stop()}catch(e){}__off.forEach(([e,f])=>document.removeEventListener(e,f));try{ac&&ac.close()}catch(e){}try{wl&&wl.release()}catch(e){}};
},
accent:function(){const __off=[];const __on=(e,f)=>{document.addEventListener(e,f);__off.push([e,f])};

const $=id=>document.getElementById(id);
const cl=(v,a,b,d)=>{v=parseInt(v,10);return isNaN(v)?d:Math.max(a,Math.min(b,v))};
let acc=[],ac=null,timer=0,raf=0,nextT=0,step=0,q=[],playing=false;
const NAME={F:"Full",D:"Down",T:"Tap",U:"Up"};
function strokeOf(A,i){const T=A.length,a=A[i],b=A[(i+2)%T];return a?(b?"F":"D"):(b?"U":"T")}
function stroke(i){return strokeOf(acc,i)}
function gen(){stop();
  const m=cl($("m").value,1,32,16),mode=$("mode").value;
  acc=Array(m*4).fill(0);$("st").max=m;$("st").value=1;
  for(let k=0;k<m;k++){
    if(mode==="bar1")acc[k*4+Math.floor(Math.random()*4)]=1;
    else for(let t=0;t<4;t++)if(Math.random()<.35)acc[k*4+t]=1;
  }
  render();
}
function beatG(A,b,bar,ids){
  const YC=78,top=46,X=t=>12.5+t*25;
  let g='<g stroke="var(--line)" stroke-width="1">';
  for(let l=0;l<5;l++)g+=`<line x1="0" x2="100" y1="${62+l*8}" y2="${62+l*8}"/>`;
  g+='</g><g stroke="currentColor" stroke-width="1.6">';
  if(bar)g+='<line x1="98.8" x2="98.8" y1="62" y2="94" stroke-width="3"/>';
  g+='</g>';
  for(let t=0;t<4;t++){
    const i=b*4+t,x=X(t),k=strokeOf(A,i);
    g+=`<g class="nh"${ids?` data-i="${i}"`:""} fill="currentColor" stroke="currentColor"><ellipse cx="${x}" cy="${YC}" rx="5.3" ry="3.8" transform="rotate(-20 ${x} ${YC})" stroke="none"/><line x1="${x+4.9}" x2="${x+4.9}" y1="${YC-1}" y2="${top}" stroke-width="1.5"/></g>`;
    if(A[i])g+=`<path d="M${x-5} 32L${x+5} 36.5L${x-5} 41" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(k!=="T")g+=`<text class="hint" x="${x}" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="${k==="F"?"var(--acc)":k==="D"?"var(--amb)":"var(--hit)"}" stroke="none">${k}</text>`;
  }
  const a=X(0)+4.9-.7,c=X(3)+4.9+.7;
  g+=`<g fill="currentColor" stroke="none"><polygon points="${a},${top} ${c},${top} ${c},${top+4.2} ${a},${top+4.2}"/><polygon points="${a},${top+7} ${c},${top+7} ${c},${top+11} ${a},${top+11}"/></g>`;
  return g;
}
function render(){
  const sh=$("sheet");let h="";
  for(let b=0;b<acc.length/4;b++){
    h+=`<div class="card${b%8==0?" s8":""}" tabindex="0" role="button"><span class="idx" title="從這一拍開始">${b+1}</span><svg class="st" viewBox="0 8 100 90" role="img" aria-label="第${b+1}拍">${beatG(acc,b,b%4==3,true)}</svg></div>`;
  }
  sh.innerHTML=h;markStart();
  
}
// 全部 16 種組合：兩拍一組、每拍 1 個重音；數字＝該拍重音在第幾個音，順序 1+1 1+2 1+3 1+4 2+1 … 4+4
// 每個組合視為循環，手法（F/D/U）依「下一個四拍」（循環回到本組合第 1 拍）判斷
function renderAll16(){
  let h="";
  for(let p=0;p<4;p++)for(let q=0;q<4;q++){
    const A=Array(8).fill(0);A[p]=1;A[4+q]=1;
    h+=`<div class="card"><span class="cb">${p+1}+${q+1}</span><svg class="st" viewBox="0 8 200 90" role="img" aria-label="組合 ${p+1}+${q+1}">${beatG(A,0,false,false)}<g transform="translate(100 0)">${beatG(A,1,true,false)}</g></svg></div>`;
  }
  $("all16").innerHTML=h;
}
function setStart(v){$("st").value=cl(v,1,acc.length/4,1);markStart()}
function markStart(){document.querySelectorAll("#sheet .startc").forEach(e=>e.classList.remove("startc"));const c=$("sheet").children[cl($("st").value,1,acc.length/4,1)-1];if(c)c.classList.add("startc")}

$("sheet").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;if(e.target.closest(".idx")){setStart([...$("sheet").children].indexOf(c)+1);return}if(e.target.closest("svg"))c.classList.toggle("sh")});
$("sheet").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();e.target.classList.toggle("sh")}});
function setM(v){$("m").value=$("mr").value=cl(v,1,32,16);gen()}
$("mr").oninput=()=>setM($("mr").value);
$("m").onchange=()=>setM($("m").value);
$("mm").onclick=()=>setM(cl($("m").value,1,32,16)-1);
$("mp").onclick=()=>setM(cl($("m").value,1,32,16)+1);
$("mode").onchange=gen;$("go").onclick=gen;
$("show").onchange=e=>$("sheet").classList.toggle("showall",e.target.checked);
$("hideidx").onchange=e=>$("sheet").classList.toggle("hideidx",e.target.checked);
$("dyn").onchange=e=>{if(!e.target.checked)document.querySelectorAll(".on,.cur").forEach(x=>x.classList.remove("on","cur"))};
const bi=$("bpm"),br=$("brng"),bc=v=>cl(v,10,180,60);
bi.oninput=()=>{if(bi.value!=="")br.value=bc(bi.value)};
bi.onchange=()=>{bi.value=br.value=bc(bi.value)};
br.oninput=()=>{bi.value=br.value};
$("bm").onclick=()=>{bi.value=br.value=bc(bc(bi.value)-1)};
$("bp").onclick=()=>{bi.value=br.value=bc(bc(bi.value)+1)};
function tone(t,f0,f1,v,len,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!=f0)o.frequency.exponentialRampToValueAtTime(f1,t+len*.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.02)}
function sched(){
  const sd=60/bc(bi.value)/4,total=acc.length;
  while(nextT<ac.currentTime+.12){
    if($("met").checked){const a=step%4==0;tone(nextT,a?1000:700,a?1000:700,a?.35:.2,.04,"sine")}
    if($("drm").checked)acc[step]?tone(nextT,260,110,.9,.16,"triangle"):tone(nextT,260,110,.2,.09,"triangle");
    q.push([nextT,step]);nextT+=sd;step=(step+1)%total;
  }
}
function mark(i){
  document.querySelectorAll(".on,.cur").forEach(e=>e.classList.remove("on","cur"));
  const els=document.querySelectorAll(`[data-i="${i}"]`);els.forEach(e=>e.classList.add("on"));
  const cd=$("sheet").children[i>>2];if(cd){cd.classList.add("cur");if(i%4==0)cd.scrollIntoView({block:"nearest",behavior:"smooth"})}
}
function loop(){const t=ac.currentTime;while(q.length&&q[0][0]<=t){const e=q.shift();if($("dyn").checked)mark(e[1])}raf=requestAnimationFrame(loop)}
function start(){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  step=(cl($("st").value,1,acc.length/4,1)-1)*4;q=[];nextT=ac.currentTime+.1;
  {const c=$("sheet").children[step>>2];if(c)c.scrollIntoView({block:"nearest",behavior:"smooth"})}
  if($("dyn").checked){const sd=60/bc(bi.value)/4;
    for(let i=0;i<4;i++){const a=i==0;tone(nextT+i*sd,a?1000:700,a?1000:700,a?.35:.2,.04,"sine")}
    nextT+=sd*4}
  timer=setInterval(sched,25);raf=requestAnimationFrame(loop);playing=true;$("play").textContent="■ 停止";
}
function stop(){clearInterval(timer);cancelAnimationFrame(raf);q=[];playing=false;$("play").textContent="▶ 播放";document.querySelectorAll(".on,.cur").forEach(e=>e.classList.remove("on","cur"))}
$("play").onclick=()=>playing?stop():start();
let wl=null;
async function keepAwake(){if(wl||!("wakeLock" in navigator)||document.visibilityState!=="visible")return;try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}catch(e){wl=null}}
__on("visibilitychange",keepAwake);
["pointerdown","keydown"].forEach(ev=>__on(ev,keepAwake));
gen();renderAll16();

return ()=>{try{stop()}catch(e){}__off.forEach(([e,f])=>document.removeEventListener(e,f));try{ac&&ac.close()}catch(e){}try{wl&&wl.release()}catch(e){}};
}};
</script>
<script>
(function(){
const g=id=>document.getElementById(id);
const T={cards:"切分音",accent:"輕重音"};
const css={},html={};
for(const k in T){css[k]=g("c-"+k).textContent;html[k]=g("t-"+k).innerHTML}
let cur=null,off=null;
function route(){
 const h=location.hash.slice(1),k=T[h]?h:"home";
 if(k===cur)return;
 if(off){try{off()}catch(e){}off=null}
 cur=k;const hm=k==="home";
 g("home").hidden=!hm;g("bar").hidden=hm;
 g("pagecss").textContent=hm?"":css[k];
 g("mount").innerHTML=hm?"":html[k];
 document.title=hm?"鼓手練習室":T[k];
 window.scrollTo(0,0);
 if(!hm)off=window.PAGES[k]();
}
window.addEventListener("hashchange",route);route();
})();
</script>
</body>
