<style id="shell">
:root{--bg:#f6f7f9;--paper:#fff;--ink:#1c2130;--sub:#6b7280;--bd:#dde1e8;--hit:#2f5bd8;--acc:#d6334a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--paper:#1c212c;--ink:#e9ecf3;--sub:#9aa3b2;--bd:#2c3342;--hit:#7ea1ff;--acc:#ff6b7f}}
:root[data-theme="dark"]{--bg:#14171f;--paper:#1c212c;--ink:#e9ecf3;--sub:#9aa3b2;--bd:#2c3342;--hit:#7ea1ff;--acc:#ff6b7f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand .lead{margin:0}
.logo{flex:none;width:78px;height:78px;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-mask-image:radial-gradient(circle, #000 58%, rgba(0,0,0,0.6) 76%, transparent 98%);mask-image:radial-gradient(circle, #000 58%, rgba(0,0,0,0.6) 76%, transparent 98%)}
.copy{margin:34px 0 0;padding-top:14px;border-top:1px solid var(--bd);text-align:center;color:var(--sub);font-size:.8rem;line-height:1.7}
#bar{max-width:2000px;margin:0 auto;padding:10px 16px 0}
#bar a{color:var(--hit);text-decoration:none;font-size:.9rem}
.hm{max-width:720px;margin:0 auto;padding:28px 16px 48px}
.hm h1{font-size:1.5rem;margin:0;letter-spacing:.04em}
.hm-list{display:grid;gap:12px}
.hm-item{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--bd);border-radius:10px;padding:14px 18px}
.hm-item:hover{border-color:var(--hit)}
.hm-item:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
.hm-item b{display:block;font-size:1.15rem;color:var(--hit)}
.hm-item span{font-size:.88rem;color:var(--sub)}
</style>

<h1>輕重音鼓譜練習</h1>
<p class="lead">「&gt;」是重拍，點小節看手法，點小節編號重設起始小節。<br>Full 高→高　Down 高→低　Tap 低→低　Up 低→高　<span class="cR">藍線右手</span>　<span class="cL">橙線左手</span></p>

<script type="text/plain" id="c-cards">
:root{--bg:#f6f7f9;--paper:#fff;--ink:#1c2130;--sub:#6b7280;--line:#aab0bc;--hit:#2f5bd8;--miss:#eb9aa0;--acc:#d6334a;--bd:#dde1e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--paper:#1c212c;--ink:#e9ecf3;--sub:#9aa3b2;--line:#566074;--hit:#7ea1ff;--miss:#8a4a52;--acc:#ff6b7f;--bd:#2c3342}}
:root[data-theme="dark"]{--bg:#14171f;--paper:#1c212c;--ink:#e9ecf3;--sub:#9aa3b2;--line:#566074;--hit:#7ea1ff;--miss:#8a4a52;--acc:#ff6b7f;--bd:#2c3342}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:2000px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.04em}
.lead{margin:0 0 18px;color:var(--sub);font-size:.92rem}
.lead b{color:var(--hit)}.lead i{font-style:normal;color:var(--miss);font-weight:700}
.panel{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--paper);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.panel label{font-weight:600}
.num{display:flex;align-items:center;gap:6px}
.num input[type=number]{width:4.2em;font:inherit;font-size:1.1rem;text-align:center;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 12px}
button.step{width:36px;padding:6px 0;font-size:1.1rem}
button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;padding:8px 22px}
button:focus-visible,input:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
input[type=range]{flex:1 1 160px;min-width:140px;accent-color:var(--acc)}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.measure{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border-radius:6px}
.card{position:relative}
#all .card+.card{border-left:1px dashed var(--bd)}
.card svg{display:block;width:100%;height:auto}
.card svg .num{display:none}
#all .card svg .num,#sheet.shownum .card svg .num,#sheet .card.on svg .num{display:inline}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
#bpm{width:4.2em;font:inherit;text-align:center;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink)}
#sheet .card.cur{background:color-mix(in srgb,var(--hit) 14%,transparent)}
.nt.on{fill:var(--acc);stroke:var(--acc)}
button.play{border-color:var(--hit);color:var(--hit);font-weight:700}
.derive{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ditem{background:var(--paper);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.ditem h3{margin:0 0 6px;font-size:1rem}
.drow{display:flex;align-items:flex-start;gap:16px}
.drow figure{margin:0;flex:1 1 0;min-width:0}
.drow figcaption{font-size:.72rem;color:var(--sub);text-align:center;line-height:1.3}
.drow figure:last-child figcaption{color:var(--ink);font-weight:600}
.drow .ar{position:absolute;left:-14px;top:78%;transform:translate(-50%,-50%);color:var(--sub);font-size:.9rem;line-height:1}
h2{font-size:1.2rem;margin:36px 0 6px}
#derive .card.first svg .num{display:inline}

<script>

  s+=`<circle cx="${px-4.5}" cy="${py+3.5}" r="2.4"/><path d="M${px-4.5} ${py+3.5}Q${px} ${py+3.5} ${px} ${py-.5}" fill="none" stroke-width="1.4"/>`}

 if(first)g+=`<line x1=".8" x2=".8" y1="62" y2="94"/>`;
 if(last)g+=`<line x1="99.2" x2="99.2" y1="62" y2="94"/>`;
 g+=`</g>`;
 for(let i=0;i<4;i++)g+=`<text class="num" x="${X(i)}" y="22" text-anchor="middle" font-size="12" font-weight="${hit[i]?700:400}" fill="${hit[i]?"var(--hit)":"var(--miss)"}">${i+1}</text>`;
 let wsum=0;ev.forEach(o=>{o.w=o.k=="r"?(o.d==1?13:o.d==2?15:20):(o.d==3?19:16);wsum+=o.w});let cx0=48-wsum/2;ev.forEach(o=>{o.x=cx0+o.w/2;cx0+=o.w});

 ev.forEach(o=>{if(o.k=="n"&&o.d<4)cur.push(o);else{if(cur.length)groups.push(cur);cur=[];}});
 if(cur.length)groups.push(cur);
 const grouped=new Set();groups.forEach(gr=>{if(gr.length>=2)gr.forEach(o=>grouped.add(o))});
 ev.forEach(o=>{const x=o.x;
  if(o.k=="r"){const cx=x;body+=o.d==1?sixteenthRest(cx):eighthRest(cx)+(o.d==3?`<circle cx="${cx+7}" cy="${YC-3}" r="1.8" stroke="none"/>`:"");return}

  if(o.d==3)body+=`<circle cx="${x+11}" cy="${YC-4}" r="1.8" stroke="none"/>`;

 });
 groups.forEach(gr=>{if(gr.length<2)return;

   if(nx&&nx.d==1)body+=`<polygon stroke="none" points="${x},${top+7} ${xs[i+1]},${top+7} ${xs[i+1]},${top+11} ${x},${top+11}"/>`;

function render(list,el,num){

 for(let i=0;i<list.length;i+=4){
  const m=document.createElement("div");m.className="measure";
  const part=list.slice(i,i+4);

const $=id=>document.getElementById(id),inp=$("n"),rng=$("r");

 curList=list;render(list,$("sheet"));si.max=Math.max(n,1);si.disabled=!n;setStart(1);
 $("count").textContent=`共 ${n} 張，${Math.ceil(n/4)} 小節（點卡片顯示數字；點卡片左上角的編號可設為起點）`;}
inp.oninput=()=>{if(inp.value!=="")rng.value=clamp(inp.value)};

$("shownum").onchange=e=>$("sheet").classList.toggle("shownum",e.target.checked);
let ac=null,timer=0,raf=0,nextT=0,step=0,q=[],curList=[],playing=false,cts=[];

  if($("met").checked){const a=s==0,f=a?1000:700;tone(nextT,f,f,a?.35:.2,.04,"sine")}

 for(let i=0;i<4;i++){const a=i==0,f=a?1000:700;tone(t0+i*sd,f,f,a?.35:.2,.04,"sine")}}

CARDS.forEach(c=>{const st=derive(c),h=hitsOf(c).map(i=>i+1);
 const it=document.createElement("div");it.className="ditem";
 it.innerHTML=`<h3>${h.length==4?"1、2、3、4 全打":"打 "+h.join("、")}</h3><div class="drow">`+st.map(([e,l],i)=>`<figure><div class="card${i?"":" first"}">${i?`<span class="ar">→</span>`:""}${cardSVG({id:l,e},false,false)}</div><figcaption>${l}${i==st.length-1?"（最簡）":""}</figcaption></figure>`).join("")+`</div>`;

},
accent:function(){const __off=[];const __on=(e,f)=>{document.addEventListener(e,f);__off.push([e,f])};

const $=id=>document.getElementById(id);
const cl=(v,a,b,d)=>{v=parseInt(v,10);return isNaN(v)?d:Math.max(a,Math.min(b,v))};
let acc=[],ac=null,timer=0,raf=0,nextT=0,step=0,q=[],playing=false;
const NAME={F:"Full",D:"Down",T:"Tap",U:"Up"};
function stroke(i){const T=acc.length,a=acc[i],b=acc[(i+2)%T];return a?(b?"F":"D"):(b?"U":"T")}
function gen(){
  const m=cl($("m").value,1,32,16),mode=$("mode").value;
  acc=Array(m*4).fill(0);$("st").max=m;$("st").value=cl($("st").value,1,m,1);
  for(let k=0;k<m;k++){
    if(mode==="bar1")acc[k*4+Math.floor(Math.random()*4)]=1;
    else for(let t=0;t<4;t++)if(Math.random()<.35)acc[k*4+t]=1;
  }
  render();
}
function lanes(b){
  const HI=4,LO=18,HT=27,XT=[12.5,37.5,62.5,87.5];
  let s='<svg viewBox="0 0 100 62" role="img" aria-label="手法">';
  [0,1].forEach(h=>{
    const oy=h*31,col=h?"var(--amb)":"var(--hit)",ts=[h,h+2],Y=v=>oy+(v?HI:LO);
    let d="",dots="";
    ts.forEach((t,n)=>{
      const i=b*4+t,k=stroke(i),hs=(k=="F"||k=="D"),he=(k=="F"||k=="U"),x=XT[t];
      if(n==0)d+=`M0 ${Y(hs)}`;
      d+=`L${x-9} ${Y(hs)}L${x} ${oy+HT}L${x+9} ${Y(he)}`;
      if(n==ts.length-1)d+=`L100 ${Y(he)}`;
      dots+=`<circle class="hd" data-i="${i}" cx="${x}" cy="${oy+HT}" r="${acc[i]?3:1.8}" fill="${acc[i]?"var(--acc)":col}"/>`;
    });
    s+=`<line x1="0" x2="100" y1="${oy+HT}" y2="${oy+HT}" stroke="var(--bd)" stroke-width="1"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  });
  return s+'</svg>';
}
function render(){
  const sh=$("sheet"),YC=78,top=46,X=t=>12.5+t*25;let h="";
  for(let b=0;b<acc.length/4;b++){
    let g='<g stroke="var(--line)" stroke-width="1">';
    for(let l=0;l<5;l++)g+=`<line x1="0" x2="100" y1="${62+l*8}" y2="${62+l*8}"/>`;
    g+='</g><g stroke="currentColor" stroke-width="1.6">';
    
    if(b%4==3)g+='<line x1="98.8" x2="98.8" y1="62" y2="94" stroke-width="3"/>';
    g+='</g>';
    let row="";
    for(let t=0;t<4;t++){
      const i=b*4+t,x=X(t),k=stroke(i);
      g+=`<g class="nh" data-i="${i}" fill="currentColor" stroke="currentColor"><ellipse cx="${x}" cy="${YC}" rx="5.3" ry="3.8" transform="rotate(-20 ${x} ${YC})" stroke="none"/><line x1="${x+4.9}" x2="${x+4.9}" y1="${YC-1}" y2="${top}" stroke-width="1.5"/></g>`;
      if(acc[i])g+=`<path d="M${x-5} 32L${x+5} 36.5L${x-5} 41" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      const y0=(k=="F"||k=="D")?4:18,y1=(k=="F"||k=="U")?4:18;
      row+=`<div class="nt" data-i="${i}"><span class="stk ${k}"><svg viewBox="0 0 22 26"><path d="M4 ${y0}L18 ${y1}" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="4" cy="${y0}" r="2.6" fill="currentColor"/><circle cx="18" cy="${y1}" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>${NAME[k]}</span></span></div>`;
    }
    row=lanes(b);const a=X(0)+4.9-.7,c=X(3)+4.9+.7;
    g+=`<g fill="currentColor" stroke="none"><polygon points="${a},${top} ${c},${top} ${c},${top+4.2} ${a},${top+4.2}"/><polygon points="${a},${top+7} ${c},${top+7} ${c},${top+11} ${a},${top+11}"/></g>`;
    h+=`<div class="card${b%8==0?" s8":""}" tabindex="0" role="button"><span class="idx" title="設為起始小節">${b+1}</span><svg class="st" viewBox="0 29 100 68" role="img" aria-label="第${b+1}小節">${g}</svg><div class="row">${row}</div></div>`;
  }
  sh.innerHTML=h;markStart();
  
}
function setStart(v){$("st").value=cl(v,1,acc.length/4,1);markStart()}
function markStart(){document.querySelectorAll("#sheet .startc").forEach(e=>e.classList.remove("startc"));const c=$("sheet").children[cl($("st").value,1,acc.length/4,1)-1];if(c)c.classList.add("startc")}
$("st").onchange=()=>setStart($("st").value);
$("sm").onclick=()=>setStart(cl($("st").value,1,acc.length/4,1)-1);
$("sp").onclick=()=>setStart(cl($("st").value,1,acc.length/4,1)+1);
$("sheet").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;if(e.target.closest(".idx")){setStart([...$("sheet").children].indexOf(c)+1);return}c.classList.toggle("sh")});
$("sheet").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();e.target.classList.toggle("sh")}});
function setM(v){$("m").value=$("mr").value=cl(v,1,32,16);gen()}
$("mr").oninput=()=>setM($("mr").value);
$("m").onchange=()=>setM($("m").value);
$("mm").onclick=()=>setM(cl($("m").value,1,32,16)-1);
$("mp").onclick=()=>setM(cl($("m").value,1,32,16)+1);
$("mode").onchange=gen;$("go").onclick=gen;
$("show").onchange=e=>$("sheet").classList.toggle("showall",e.target.checked);
const bi=$("bpm"),br=$("brng"),bc=v=>cl(v,10,180,60);
bi.oninput=()=>{if(bi.value!=="")br.value=bc(bi.value)};
bi.onchange=()=>{bi.value=br.value=bc(bi.value)};
br.oninput=()=>{bi.value=br.value};
$("bm").onclick=()=>{bi.value=br.value=bc(bc(bi.value)-1)};
$("bp").onclick=()=>{bi.value=br.value=bc(bc(bi.value)+1)};
function tone(t,f0,f1,v,len,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!=f0)o.frequency.exponentialRampToValueAtTime(f1,t+len*.7);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.02)}
function sched(){
  const sd=60/bc(bi.value)/4,total=acc.length;
  while(nextT<ac.currentTime+.12){
    if($("met").checked){const a=step%4==0;tone(nextT,a?1000:700,a?1000:700,a?.35:.2,.04,"sine")}
    if($("drm").checked)acc[step]?tone(nextT,260,110,.9,.16,"triangle"):tone(nextT,260,110,.2,.09,"triangle");
    q.push([nextT,step]);nextT+=sd;step=(step+1)%total;
  }
}
function mark(i){
  document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
  const els=document.querySelectorAll(`[data-i="${i}"]`);els.forEach(e=>e.classList.add("on"));
  if(i%4==0&&els[0])els[0].closest(".card").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function loop(){const t=ac.currentTime;while(q.length&&q[0][0]<=t)mark(q.shift()[1]);raf=requestAnimationFrame(loop)}
function start(){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  step=(cl($("st").value,1,acc.length/4,1)-1)*4;q=[];nextT=ac.currentTime+.1;
  const sd=60/bc(bi.value)/4;
  for(let i=0;i<4;i++){const a=i==0;tone(nextT+i*sd,a?1000:700,a?1000:700,a?.35:.2,.04,"sine")}
  nextT+=sd*4;
  timer=setInterval(sched,25);raf=requestAnimationFrame(loop);playing=true;$("play").textContent="■ 停止";
}
function stop(){clearInterval(timer);cancelAnimationFrame(raf);q=[];playing=false;$("play").textContent="▶ 播放";document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"))}
$("play").onclick=()=>playing?stop():start();
let wl=null;
async function keepAwake(){if(wl||!("wakeLock" in navigator)||document.visibilityState!=="visible")return;try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}catch(e){wl=null}}
__on("visibilitychange",keepAwake);
["pointerdown","keydown"].forEach(ev=>__on(ev,keepAwake));
gen();

return ()=>{try{stop()}catch(e){}__off.forEach(([e,f])=>document.removeEventListener(e,f));try{ac&&ac.close()}catch(e){}try{wl&&wl.release()}catch(e){}};
}};
</script>
